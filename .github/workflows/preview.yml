# Builds the live site and publishes it to GitHub Pages at https://dixonsvelux.co.uk
# on every push to main. Indexable: canonicals, sitemap.xml and robots.txt all use site.url.
# One-off setup: repo Settings → Pages → Source: "GitHub Actions", custom domain dixonsvelux.co.uk.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site
        run: node build.js
      - name: Check links and structured data
        run: node check.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
