# Builds a noindex preview of the site and publishes it to GitHub Pages
# at https://markdevonuk.github.io/dixons/ on every push to main.
# One-off setup: repo Settings → Pages → Source: "GitHub Actions".
name: Preview on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build preview
        run: node build.js
        env:
          BASE_PATH: /dixons
          PREVIEW: 1
      - name: Check links and structured data
        run: node check.js
        env:
          BASE_PATH: /dixons
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
